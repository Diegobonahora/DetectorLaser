<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Detector Láser</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<header>
  <h1>Detector Láser <small id="ver"></small></h1>
  <nav>
    <button data-tab="camara" class="on">Cámara</button>
    <button data-tab="galeria">Galería <span id="cuenta"></span></button>
  </nav>
</header>
<main>
  <section id="camara">
    <div id="visor">
      <video id="video" playsinline muted></video>
      <canvas id="overlay"></canvas>
      <button id="aviso" hidden></button>
    </div>
    <div class="fila">
      <button id="btnCam" class="pri">Iniciar cámara</button>
      <button id="btnParar" hidden>Detener</button>
    </div>
    <p id="estado">Cámara apagada</p>
    <details open>
      <summary>Ajustes</summary>
      <label>Sensibilidad: <b id="sensVal"></b>
        <input type="range" id="sens" min="1" max="10" step="1">
      </label>
      <label class="chk"><input type="checkbox" id="debug"> Modo prueba (marca lo que se detecta)</label>
      <label class="chk"><input type="checkbox" id="expo"> Reducir exposición (si el celular lo permite)</label>
      <label>Cámara
        <select id="selCam"><option value="">Automática (evita gran angular)</option></select>
      </label>
      <label id="zoomBox" hidden>Zoom: <b id="zoomVal"></b>
        <input type="range" id="zoom" step="0.1">
      </label>
      <p class="nota">Modo prueba: verde = candidato, naranja = objeto fijo ignorado.</p>
    </details>
  </section>

  <section id="galeria" hidden>
    <div class="fila">
      <input type="search" id="buscar" placeholder="Buscar por título, lugar, etiquetas…">
      <button id="btnExport">Exportar JSON</button>
    </div>
    <div id="grilla"></div>
    <p id="vacio" hidden>Todavía no hay fotos. Iniciá la cámara y apuntá el láser.</p>
  </section>
</main>

<dialog id="ficha">
  <img id="fImg" alt="Foto capturada">
  <p id="fFecha" class="nota"></p>
  <label>Título <input id="fTitulo" maxlength="120"></label>
  <label>Descripción <textarea id="fDesc" rows="3"></textarea></label>
  <label>Lugar u objeto señalado <input id="fLugar" maxlength="120"></label>
  <label>Etiquetas (separadas por coma) <input id="fTags"></label>
  <div class="fila">
    <button id="fGuardar" class="pri">Guardar</button>
    <button id="fCerrar">Cerrar</button>
  </div>
  <div class="fila">
    <button id="fDescargar">Descargar imagen</button>
    <button id="fCompartir">Compartir</button>
    <button id="fEliminar" class="peligro">Eliminar</button>
  </div>
</dialog>

<script src="config.js"></script>
<script src="detector.js"></script>
<script src="app.js"></script>
</body>
</html>
